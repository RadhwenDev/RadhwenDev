<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="auto">
  <defs>
    <!-- تأثير التوهج النيون -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- تدرج التلاشي للخطين الجانبيين -->
    <linearGradient id="fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="fade-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g filter="url(#glow)">
    <!-- الخط الأيسر مع التلاشي -->
    <line x1="50" y1="50" x2="410" y2="50" stroke="url(#fade-left)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- المعين الصغير الأيسر -->
    <polygon points="418,50 423,45 428,50 423,55" fill="#80e5ff" />
    <line x1="428" y1="50" x2="455" y2="50" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" />

    <!-- العنصر المركزي (المعين الكبير والنقطة) -->
    <polygon points="500,25 525,50 500,75 475,50" fill="none" stroke="#00d2ff" stroke-width="3" />
    <circle cx="500" cy="50" r="4.5" fill="#80e5ff" />

    <!-- المعين الصغير الأيمن -->
    <line x1="545" y1="50" x2="572" y2="50" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="572,50 577,45 582,50 577,55" fill="#80e5ff" />

    <!-- الخط الأيمن مع التلاشي -->
    <line x1="590" y1="50" x2="950" y2="50" stroke="url(#fade-right)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
