<svg width="1000" height="60" viewBox="0 0 1000 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Fade Gradient -->
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1890ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#1890ff" stop-opacity="1" />
    </linearGradient>

    <!-- Right Fade Gradient -->
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1890ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#1890ff" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Left Fading Line -->
    <line x1="50" y1="30" x2="415" y2="30" stroke="url(#fadeLeft)" stroke-width="2.5" />

    <!-- Left Small Diamond Accent -->
    <path d="M425 25L430 30L425 35L420 30Z" fill="#1890ff" />

    <!-- Left Short Connector Line -->
    <line x1="435" y1="30" x2="455" y2="30" stroke="#1890ff" stroke-width="2.5" />

    <!-- Center Main Diamond -->
    <path d="M500 12L518 30L500 48L482 30Z" stroke="#1890ff" stroke-width="3" fill="none" />

    <!-- Center Dot -->
    <circle cx="500" cy="30" r="3.5" fill="#1890ff" />

    <!-- Right Short Connector Line -->
    <line x1="545" y1="30" x2="565" y2="30" stroke="#1890ff" stroke-width="2.5" />

    <!-- Right Small Diamond Accent -->
    <path d="M575 25L580 30L575 35L570 30Z" fill="#1890ff" />

    <!-- Right Fading Line -->
    <line x1="585" y1="30" x2="950" y2="30" stroke="url(#fadeRight)" stroke-width="2.5" />
  </g>
</svg>
